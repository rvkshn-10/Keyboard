<!doctype html><meta charset="utf-8"><title>CAD assembly process</title><style>body{font:17px/1.6 system-ui;background:#f3f5f8;max-width:1100px;margin:40px auto;padding:20px}figure{background:white;padding:24px;margin:25px 0;border-radius:14px}img{width:100%}</style><h1>October 12 — CAD assembly process</h1><p>Actual PCB import, positioning, inspection and spacer installation in Fusion, in capture order.</p><figure><h2>1. Import the KiCad STEP</h2><a href="01-import-pcb.png"><img src="01-import-pcb.png"></a><figcaption>Imported the actual KiCad PCB and available component models into Fusion. It initially retained the KiCad origin, outside the case.</figcaption></figure><figure><h2>2. Align the PCB</h2><a href="02-align-pcb-to-base.png"><img src="02-align-pcb-to-base.png"></a><figcaption>Translated the PCB into the case coordinate system, matching the board position used for the four mounting bosses.</figcaption></figure><figure><h2>3. Set mounting height</h2><a href="03-pcb-mounting-height.png"><img src="03-pcb-mounting-height.png"></a><figcaption>Positioned the PCB underside at 21mm above the case floor origin, with the plate hidden to inspect the placement.</figcaption></figure><figure><h2>4. Inspect underside access</h2><a href="04-pico-usb-access.png"><img src="04-pico-usb-access.png"></a><figcaption>Checked the imported Pico against the USB pocket and BOOTSEL opening. This is a visual inspection; plug insertion and cable bending remain untested.</figcaption></figure><figure><h2>5. Restore the switch plate</h2><a href="05-fit-switch-plate.png"><img src="05-fit-switch-plate.png"></a><figcaption>Displayed the plate above the PCB to inspect the key-opening alignment. Switch and keycap models are absent from this KiCad export.</figcaption></figure><figure><h2>6. Inspect the combined assembly</h2><a href="06-complete-pcb-case.png"><img src="06-complete-pcb-case.png"></a><figcaption>Viewed the case, actual PCB and plate together. The knob and encoder remain simplified reference envelopes.</figcaption></figure><figure><h2>7. Add four plate spacers</h2><a href="07-install-plate-spacers.png"><img src="07-install-plate-spacers.png"></a><figcaption>Imported four spacer solids at the mounting-hole positions, starting at the planned PCB top height of 22.6mm. They provide the 3.5mm plate gap.</figcaption></figure><figure><h2>8. Restore the assembled model</h2><a href="08-assembled-with-spacers.png"><img src="08-assembled-with-spacers.png"></a><figcaption>Restored the plate and exported the updated Fusion and STEP assemblies with PCB and spacers included. Physical fit remains unverified.</figcaption></figure>
