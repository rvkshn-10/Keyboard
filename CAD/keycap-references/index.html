<meta charset="utf-8"><title>Keycaps and spacebar CAD</title><style>body{font:18px system-ui;max-width:1100px;margin:40px auto;background:#f3f5f8}figure{background:white;padding:24px;margin:25px 0}img{width:100%}</style><h1>Keycaps and spacebar CAD references</h1><p>Generic geometry references; not manufacturer models or printable functional keycaps.</p><figure><h2>1U keycap</h2><img src="01-1u-keycap-envelope.png"><p>Created a tapered, hollow keycap envelope to reserve space for a standard key. It has no functional MX socket.</p></figure><figure><h2>6.25U spacebar</h2><img src="02-625u-spacebar-envelope.png"><p>Created the longer ANSI spacebar envelope using the same approximate profile.</p></figure><figure><h2>Spacebar support references</h2><img src="03-spacebar-stabilizer-reference.png"><p>Added a center switch marker and two nominal stabilizer markers beneath the spacebar. These are alignment references, not working stabilizer mechanisms.</p></figure><figure><h2>Full keyboard layout</h2><img src="04-keycaps-layout-reference.png"><p>Positioned all 61 keycap envelopes at the PCB switch centers, with wider modifier keys, to inspect the overall layout in Fusion.</p></figure>
