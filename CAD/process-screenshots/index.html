<!doctype html><meta charset="utf-8"><title>Keyboard61 CAD process captures</title><style>body{font:17px/1.6 system-ui;max-width:1100px;margin:40px auto;padding:0 20px;background:#f3f5f8;color:#172331}figure{margin:30px 0;padding:24px;background:white;border-radius:14px}img{width:100%;height:auto}h2{font-size:22px}figcaption{margin-top:16px}</style><h1>Keyboard61 CAD process captures</h1><p>14 real captures from print-quote checks and Fusion inspection. These show the current inspection process; they do not reconstruct earlier modeling history. The design remains a prototype pending physical fit checks.</p><figure><h2>1. Initial print upload</h2><a href="01-uploaded-models.jpg"><img loading="lazy" src="01-uploaded-models.jpg" alt="Initial print upload"></a><figcaption>Uploaded the base, plate and individual spacer to inspect the vendor quote. The tiny individual spacer was later replaced by a connected pack.</figcaption></figure><figure><h2>2. Check printing limits</h2><a href="02-fdm-size-check.jpg"><img loading="lazy" src="02-fdm-size-check.jpg" alt="Check printing limits"></a><figcaption>The selected PLA service rejected the full-width parts and tiny spacer. This led to checking resin and combining the spacers.</figcaption></figure><figure><h2>3. Assembly imported into Fusion</h2><a href="03-fusion-imported-assembly.png"><img loading="lazy" src="03-fusion-imported-assembly.png" alt="Assembly imported into Fusion"></a><figcaption>Opened the STEP assembly in Fusion to inspect the case, switch plate and reference envelopes together.</figcaption></figure><figure><h2>4. Top alignment inspection</h2><a href="04-assembly-top.png"><img loading="lazy" src="04-assembly-top.png" alt="Top alignment inspection"></a><figcaption>Checked the key openings, stabilizer slots and upper-right knob position from above.</figcaption></figure><figure><h2>5. Underside inspection</h2><a href="05-assembly-underside.png"><img loading="lazy" src="05-assembly-underside.png" alt="Underside inspection"></a><figcaption>Viewed the bottom openings and cable path. Actual plug insertion and bend clearance still need a physical fit check.</figcaption></figure><figure><h2>6. Isolate the base</h2><a href="06-base-mounting-bosses.png"><img loading="lazy" src="06-base-mounting-bosses.png" alt="Isolate the base"></a><figcaption>Hid the other components to inspect the four PCB mounting bosses and case walls.</figcaption></figure><figure><h2>7. Inspect USB access</h2><a href="07-base-usb-access.png"><img loading="lazy" src="07-base-usb-access.png" alt="Inspect USB access"></a><figcaption>Viewed the floor opening and channel intended for the inward-facing Pico USB connection.</figcaption></figure><figure><h2>8. Inspect the switch plate</h2><a href="08-switch-plate-openings.png"><img loading="lazy" src="08-switch-plate-openings.png" alt="Inspect the switch plate"></a><figcaption>Isolated the plate to check all 61 switch openings, stabilizer clearances and encoder mounting hole.</figcaption></figure><figure><h2>9. Inspect encoder support</h2><a href="09-plate-encoder-support.png"><img loading="lazy" src="09-plate-encoder-support.png" alt="Inspect encoder support"></a><figcaption>Viewed the plate underside and support walls around the case-mounted encoder. Delivered hardware dimensions need a trial fit.</figcaption></figure><figure><h2>10. Check PCB height reference</h2><a href="10-pcb-envelope.png"><img loading="lazy" src="10-pcb-envelope.png" alt="Check PCB height reference"></a><figcaption>Displayed the PCB envelope inside the base to inspect the planned mounting height. This is an envelope, not a detailed controller or switch model.</figcaption></figure><figure><h2>11. Inspect knob and encoder envelopes</h2><a href="11-encoder-knob-envelopes.png"><img loading="lazy" src="11-encoder-knob-envelopes.png" alt="Inspect knob and encoder envelopes"></a><figcaption>Isolated the simple reference bodies used to reserve room for the knob and encoder. They are not manufacturer models.</figcaption></figure><figure><h2>12. Restore the assembly</h2><a href="12-final-assembly.png"><img loading="lazy" src="12-final-assembly.png" alt="Restore the assembly"></a><figcaption>Restored the components and inspected the enclosure from the opposite isometric view.</figcaption></figure><figure><h2>13. Revised printing quote</h2><a href="14-final-jlc3dp-quote.jpg"><img loading="lazy" src="14-final-jlc3dp-quote.jpg" alt="Revised printing quote"></a><figcaption>Uploaded the revised four-spacer pack with the full base and plate. The resin quote totals $19.61 before shipping and tax.</figcaption></figure><figure><h2>14. Complete quote and shipping</h2><a href="15-print-quote-full.jpg"><img loading="lazy" src="15-print-quote-full.jpg" alt="Complete quote and shipping"></a><figcaption>Captured all three items: base $15.87, plate $3.42, spacer pack $0.32, plus $12.67 estimated shipping. No order was placed.</figcaption></figure>
