<!doctype html><meta charset="utf-8"><title>October 13 CAD process</title><style>body{font:17px/1.6 system-ui;max-width:1100px;margin:40px auto;padding:0 20px;background:#f3f5f8;color:#172331}figure{margin:30px 0;padding:24px;background:white;border-radius:14px}img{width:100%}h2{font-size:22px}figcaption{margin-top:16px}</style><h1>October 13 — slim keyboard and portrait display</h1><p>10 actual Fusion captures of generated CAD stages and assembly work. Downloaded substitute models and generated references are identified below. Physical fit and hardware behavior remain untested.</p><figure><h2>1. Inspect a downloaded switch model</h2><a href="01-downloaded-switch-model.png"><img loading="lazy" src="01-downloaded-switch-model.png"></a><figcaption>Downloaded and inspected the Acheron MX-compatible model. This is a substitute for the selected Gateron switch, not its exact manufacturer CAD.</figcaption></figure><figure><h2>2. Reduce the case height</h2><a href="02-thin-shell.png"><img loading="lazy" src="02-thin-shell.png"></a><figcaption>Generated a shell with a 2mm floor and lower walls, reducing case height from 27.6mm to 17.1mm. The wider right strip reserves space for a portrait screen.</figcaption></figure><figure><h2>3. Add PCB mounting bosses</h2><a href="03-mounting-bosses.png"><img loading="lazy" src="03-mounting-bosses.png"></a><figcaption>Added the four mounting bosses at the PCB hole coordinates. PCB underside is now 10.5mm above the origin. The slim version requires directly soldered Pico headers instead of tall sockets.</figcaption></figure><figure><h2>4. Cut controller access openings</h2><a href="04-usb-access.png"><img loading="lazy" src="04-usb-access.png"></a><figcaption>Added the underside USB pocket, cable channel, BOOTSEL and reset openings to the thinner base. Actual cable insertion still needs a fit check.</figcaption></figure><figure><h2>5. Cut the key and stabilizer openings</h2><a href="05-switch-openings.png"><img loading="lazy" src="05-switch-openings.png"></a><figcaption>Generated 61 switch openings and stabilizer clearance slots in the 1.5mm plate.</figcaption></figure><figure><h2>6. Add the upper-right knob mount</h2><a href="06-encoder-mount.png"><img loading="lazy" src="06-encoder-mount.png"></a><figcaption>Added the encoder mounting hole and underside support walls. Exact Adafruit encoder fit remains unverified.</figcaption></figure><figure><h2>7. Reserve the tall portrait display</h2><a href="07-oled-window.png"><img loading="lazy" src="07-oled-window.png"></a><figcaption>Replaced the tiny OLED idea with a 44.8 by 59.2mm window below the knob. The bottom margin is 17.2mm and the gap to the knob is 13.6mm. The TFT body is a dimensional envelope.</figcaption></figure><figure><h2>8. Place the downloaded switch models</h2><a href="08-switches-installed.png"><img loading="lazy" src="08-switches-installed.png"></a><figcaption>Placed 61 instances at the PCB switch centers. These generic MX models help inspect the assembly; exact housing clearances are still unverified.</figcaption></figure><figure><h2>9. Engrave the keycap legends</h2><a href="09-keycaps-installed.png"><img loading="lazy" src="09-keycaps-installed.png"></a><figcaption>Generated recessed legends 0.35mm deep in the generic keycap CAD. These are reference keycaps without functional MX mounting sockets; purchased keycaps are not physically modified.</figcaption></figure><figure><h2>10. Assemble the revised keyboard</h2><a href="10-complete-slim-assembly.png"><img loading="lazy" src="10-complete-slim-assembly.png"></a><figcaption>Combined the slim case, KiCad PCB, downloaded switch and encoder substitute models, engraved keycap references, spacers and portrait TFT envelope in Fusion.</figcaption></figure>
